# Default Configuration File — thesis base model (technical only)

data:
  dataset_name: "pmoe7/SP_500_Stocks_Data-ratios_news_price_10_yrs"
  train_split: 0.7
  val_split: 0.15
  test_split: 0.15
  context_length: 60
  prediction_horizon: 1

  # Fixed thesis universe (same tickers for base model and later news experiments)
  tickers:
    - "AAPL"
    - "MSFT"
    - "GOOGL"
    - "AMZN"
    - "META"
    - "NVDA"
    - "TSLA"
    - "NFLX"
    - "JPM"
    - "BAC"
    - "V"
    - "MA"
    - "JNJ"
    - "PFE"
    - "WMT"
    - "COST"
    - "KO"
    - "PEP"
    - "XOM"
    - "CVX"
  start_date: "2015-01-01"
  end_date: null

  # per_symbol: split train/val/test by time within each ticker (no cross-ticker leakage)
  split_mode: "per_symbol"
  target_column: "log_return"
  price_column: "close"
  # Set to e.g. "AAPL" to train/evaluate on a single hero ticker only; null = all tickers above
  hero_ticker: null

  features:
    technical_indicators: true
    lag_features: true
    temporal_features: true
    simplified: true
    normalize: true
    normalize_method: "standard"
    normalize_target: false
    windows: [5, 10, 20, 50]

  use_news: false
  news_cache_dir: "data/processed/news_cache"

model:
  type: "transformer"
  d_model: 256
  n_heads: 8
  n_layers: 6
  d_ff: 1024
  dropout: 0.1
  activation: "gelu"

training:
  batch_size: 64
  learning_rate: 0.0002
  num_epochs: 200
  loss: "huber"
  optimizer: "adamw"
  optimizer_params:
    betas: [0.9, 0.999]
    weight_decay: 0.02
  scheduler: "cosine"
  gradient_clip: 1.0
  early_stopping:
    patience: 15
    min_delta: 0.00001

  device: "cuda"

evaluation:
  metrics: ["mae", "rmse", "mape", "r2", "directional_accuracy"]
  save_predictions: true
  visualize: true

simulation:
  initial_capital: 100000.0
  position_size_pct: 0.3
  entry_threshold_pct: 0.5
  exit_threshold_pct: -5.0
  # Log-return thresholds for backtest when target_column is log_return
  entry_threshold_return: 0.005
  exit_threshold_return: -0.005
  commission_pct: 0.1
  risk_free_rate_annual: 0.03

paths:
  data_dir: "data"
  models_dir: "models/checkpoints"
  checkpoint_file: "best_model_base.pt"
  results_dir: "results"

# Hyperparameter tuning (scripts/tune.py).
# Two methods are supported, both reviewer-recommended:
#   - "grid":     exhaustive search over each parameter's `choices`.
#   - "bayesian": Optuna Tree-structured Parzen Estimator (TPE), much faster.
# Each trial trains a fresh model with the sampled params and returns the best
# validation loss. The training section above is reused, with `fast_overrides`
# applied to cap epochs so each trial is cheap.
tuning:
  enabled: true
  method: "bayesian"          # "grid" | "bayesian"
  n_trials: 20                # used only for bayesian
  seed: 42
  fast_overrides:             # per-trial training budget (overrides training.*)
    num_epochs: 12
    early_stopping_patience: 4
  search_space:
    learning_rate:
      type: "loguniform"      # bayesian: continuous log range
      low: 0.00005
      high: 0.001
      choices: [0.0001, 0.0002, 0.0005]   # grid fallback
    d_model:
      type: "categorical"
      choices: [128, 256]
    n_layers:
      type: "categorical"
      choices: [2, 4, 6]
    dropout:
      type: "uniform"
      low: 0.05
      high: 0.30
      choices: [0.1, 0.2, 0.3]            # grid fallback
    weight_decay:
      type: "categorical"
      choices: [0.0, 0.01, 0.05]
